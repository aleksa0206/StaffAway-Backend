name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway values: the database lives only for this job, S3 is faked in tests.
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: staffaway_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/staffaway_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      S3_REGION: eu-central-1
      S3_BUCKET: ci-unused
      S3_ACCESS_KEY_ID: ci-unused
      S3_SECRET_ACCESS_KEY: ci-unused

    steps:
      - uses: actions/checkout@v4
      # Same flag as docker-compose.prod.yaml. Old migrations use `user` instead of `User`,
      # which only works when table names are case-insensitive. Service containers can't take
      # a command, so MySQL is started by hand.
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=staffaway_test \
            mysql:8.0 --lower-case-table-names=1
          for i in $(seq 1 60); do
            docker exec mysql mysql -uroot -proot -e 'SELECT 1' staffaway_test >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs mysql
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: npx jest --runInBand

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t staffaway-backend .
